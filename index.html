<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WW Tracker</title>

  <!-- Métadonnées PWA iOS / iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WW Tracker">
  <meta name="theme-color" content="#0066cc">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/scale.png">

  <style>
    :root {
      --primary: #0066cc;
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #2c3e50;
      --accent: #27ae60;
      --warn: #e74c3c;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      padding-top: calc(env(safe-area-inset-top) + 15px);
      padding-bottom: calc(env(safe-area-inset-bottom) + 80px);
      -webkit-tap-highlight-color: transparent;
    }
    h1, h2, h3 { margin: 0 0 10px 0; }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .stat-box { text-align: center; flex: 1; }
    .stat-val { font-size: 1.5rem; font-weight: bold; color: var(--primary); }
    .stat-lbl { font-size: 0.8rem; color: #7f8c8d; }
    input, select, button, textarea {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    button {
      background: var(--primary);
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      border-radius: 8px;
    }
    .log-item {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .badge-food { background: #ebf5fb; color: var(--primary); }
    .badge-sport { background: #eafaf1; color: var(--accent); }
    .btn-del {
      background: none;
      border: none;
      color: var(--warn);
      font-size: 1.1rem;
      cursor: pointer;
      width: auto;
      padding: 0 0 0 10px;
    }
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: flex;
      border-top: 1px solid #ddd;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-btn {
      flex: 1;
      padding: 12px;
      text-align: center;
      background: none;
      color: #7f8c8d;
      border-radius: 0;
      font-size: 0.9rem;
    }
    .nav-btn.active { color: var(--primary); font-weight: bold; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .sub-text { font-size: 0.85rem; color: #7f8c8d; }
    .history-card {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <!-- ONGLET 1 : AUJOURD'HUI -->
  <div id="tab-today" class="tab-content active">
    <div class="card flex-between">
      <div class="stat-box">
        <div class="stat-val" id="disp-daily-left">23</div>
        <div class="stat-lbl">Reste jour (base 23)</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="disp-weekly-left">28</div>
        <div class="stat-lbl">Réserve hebdo + Sport</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="disp-sport-pts" style="color:var(--accent);">0</div>
        <div class="stat-lbl">Pts Sport du jour</div>
      </div>
    </div>

    <!-- Saisie Aliment -->
    <div class="card">
      <h3>🍎 Rechercher ou ajouter un aliment</h3>
      <input type="text" id="food-search" list="food-db" placeholder="Taper le nom de l'aliment..." onchange="onFoodSelect()">
      <datalist id="food-db"></datalist>
      <div id="food-portion-info" class="sub-text"></div>
      
      <div style="display:flex; gap:8px;">
        <div style="flex:1;">
          <label style="font-size:0.8rem; color:#666;">Quantité :</label>
          <input type="number" id="food-qty" value="1" min="0.1" step="0.5" oninput="updateCalculatedFoodPts()">
        </div>
        <div style="flex:1;">
          <label style="font-size:0.8rem; color:#666;">Total Points :</label>
          <input type="number" id="food-pts" placeholder="Points (ex: 3)">
        </div>
      </div>
      
      <button onclick="addEntry('food')">Ajouter au journal</button>
    </div>

    <!-- Calculateur Macro / Formule WW -->
    <div class="card">
      <h3>📊 Calculateur & Sauvegarde d'aliment</h3>
      <input type="text" id="calc-name" placeholder="Nom de ton aliment (ex: Gâteau maison)">
      
      <label style="font-size:0.8rem; color:#666;">Catégorie de l'aliment :</label>
      <select id="calc-cat">
        <!-- Rempli dynamiquement -->
      </select>

      <div style="display:flex; gap:8px;">
        <input type="number" id="calc-cal" placeholder="Calories (100g)">
        <input type="number" id="calc-sat" placeholder="Gras Sat (g)">
      </div>
      <div style="display:flex; gap:8px;">
        <input type="number" id="calc-sug" placeholder="Sucres (g)">
        <input type="number" id="calc-pro" placeholder="Protéines (g)">
      </div>
      <div style="display:flex; gap:8px;">
        <button onclick="calculateWWPoints()" style="background:#8e44ad;">Calculer les points</button>
        <button onclick="saveCustomFoodToDb()" style="background:#27ae60;">💾 Enregistrer dans la base</button>
      </div>
    </div>

    <!-- Saisie Activité -->
    <div class="card">
      <h3>🏃 Rechercher ou ajouter une activité</h3>
      <input type="text" id="sport-search" list="sport-db" placeholder="Taper l'activité..." onchange="onSportSelect()">
      <datalist id="sport-db"></datalist>
      <input type="number" id="sport-duration" placeholder="Durée en minutes (ex: 30)">
      <button onclick="addEntry('sport')" style="background:var(--accent);">Ajouter l'activité</button>
    </div>

    <!-- Journal du jour -->
    <div class="card">
      <h3>📋 Journal d'aujourd'hui</h3>
      <div id="today-log-list"></div>
    </div>

    <!-- Bulk Upload -->
    <div class="card">
      <h3>📥 Import / Export de masse (Bulk)</h3>
      <textarea id="bulk-input" rows="3" placeholder='[{"cat":"Mes Créations", "name":"Mon plat", "portion":"100g", "pts":5}]'></textarea>
      <div style="display:flex; gap:8px;">
        <button onclick="importBulkFoods()" style="background:#27ae60;">📥 Importer les aliments</button>
        <button onclick="exportCustomFoods()" style="background:#7f8c8d;">📤 Exporter ma base</button>
      </div>
    </div>
  </div>

  <!-- ONGLET 2 : HISTORIQUE -->
  <div id="tab-history" class="tab-content">
    <div class="card">
      <h3>📜 Historique des journées</h3>
      <div id="history-list"></div>
    </div>
  </div>

  <!-- BARRE DE NAVIGATION -->
  <div class="nav-bar">
    <button class="nav-btn active" onclick="switchTab('today')">Aujourd'hui</button>
    <button class="nav-btn" onclick="switchTab('history')">Historique</button>
  </div>

  function getCustomFoods() { return JSON.parse(localStorage.getItem('ww_custom_foods') || '[]'); }

  function populateCategoryDropdown() {
    const catSelect = document.getElementById('calc-cat');
    catSelect.innerHTML = '<option value="Mes Créations">⭐ Mes Créations</option>';
    const categories = Array.from(new Set(FOOD_DATABASE.map(f => f.cat))).sort();
    categories.forEach(cat => catSelect.innerHTML += `<option value="${cat}">${cat}</option>`);
  }

  function initDatalists() {
    const foodList = document.getElementById('food-db');
    foodList.innerHTML = '';
    FOOD_DATABASE.forEach(item => foodList.innerHTML += `<option value="${item.name}">${item.cat} - ${item.portion} (${item.pts} SP)</option>`);
    getCustomFoods().forEach(item => foodList.innerHTML += `<option value="${item.name}">⭐ ${item.cat} - ${item.portion} (${item.pts} SP)</option>`);

    const sportList = document.getElementById('sport-db');
    sportList.innerHTML = '';
    SPORT_DATABASE.forEach(item => sportList.innerHTML += `<option value="${item.name}">${item.intensity} - ${item.refDur} min (${item.pts} Pts)</option>`);

    populateCategoryDropdown();
  }

  function onFoodSelect() {
    const val = document.getElementById('food-search').value;
    const allFoods = [...FOOD_DATABASE, ...getCustomFoods()];
    const item = allFoods.find(f => f.name.toLowerCase() === val.toLowerCase());
    if (item) {
      currentRefPts = item.pts;
      document.getElementById('food-qty').value = 1;
      document.getElementById('food-portion-info').innerText = `Portion réf : ${item.portion} (${item.pts} SP)`;
      updateCalculatedFoodPts();
    }
  }

  function updateCalculatedFoodPts() {
    const qty = parseFloat(document.getElementById('food-qty').value) || 1;
    document.getElementById('food-pts').value = Math.round(currentRefPts * qty * 10) / 10;
  }

  function onSportSelect() {
    const val = document.getElementById('sport-search').value;
    const item = SPORT_DATABASE.find(s => s.name.toLowerCase() === val.toLowerCase());
    if (item) document.getElementById('sport-duration').value = item.refDur;
  }

  function calculateWWPoints() {
    const name = document.getElementById('calc-name').value || "Aliment calculé (100g)";
    const cal = parseFloat(document.getElementById('calc-cal').value) || 0;
    const sat = parseFloat(document.getElementById('calc-sat').value) || 0;
    const sug = parseFloat(document.getElementById('calc-sug').value) || 0;
    const pro = parseFloat(document.getElementById('calc-pro').value) || 0;

    let pts = Math.max(0, Math.round((cal / 33) + (sat * 0.36) + (sug / 4) - (pro / 11)));
    document.getElementById('food-search').value = name;
    currentRefPts = pts;
    document.getElementById('food-qty').value = 1;
    document.getElementById('food-pts').value = pts;
    document.getElementById('food-portion-info').innerText = `Résultat formule : ${pts} SP pour 100g`;
    return pts;
  }

  function saveCustomFoodToDb() {
    const name = document.getElementById('calc-name').value.trim();
    const selectedCat = document.getElementById('calc-cat').value || "Mes Créations";
    if (!name) return alert("Indique un nom pour ton aliment avant de l'enregistrer !");

    const pts = calculateWWPoints();
    const customFoods = getCustomFoods();
    const existingIndex = customFoods.findIndex(f => f.name.toLowerCase() === name.toLowerCase());
    const foodObj = { cat: selectedCat, name: name, portion: "100g", pts: pts };

    if (existingIndex !== -1) customFoods[existingIndex] = foodObj;
    else customFoods.push(foodObj);

    localStorage.setItem('ww_custom_foods', JSON.stringify(customFoods));
    initDatalists();
    alert(`L'aliment "${name}" (${pts} SP) a été enregistré dans "${selectedCat}" !`);
  }

  function importBulkFoods() {
    const rawText = document.getElementById('bulk-input').value.trim();
    if (!rawText) return alert("Colle d'abord tes données JSON.");
    try {
      const newItems = JSON.parse(rawText);
      if (!Array.isArray(newItems)) return alert("Format invalide.");
      const customFoods = getCustomFoods();
      let added = 0;
      newItems.forEach(item => {
        if (item.name && item.pts !== undefined) {
          const name = item.name.trim();
          const existingIndex = customFoods.findIndex(f => f.name.toLowerCase() === name.toLowerCase());
          const foodObj = { cat: item.cat || "Importé", name, portion: item.portion || "100g", pts: parseFloat(item.pts) || 0 };
          if (existingIndex !== -1) customFoods[existingIndex] = foodObj;
          else customFoods.push(foodObj);
          added++;
        }
      });
      localStorage.setItem('ww_custom_foods', JSON.stringify(customFoods));
      initDatalists();
      document.getElementById('bulk-input').value = '';
      alert(`Succès : ${added} aliment(s) mis à jour !`);
    } catch (e) {
      alert("Erreur de format JSON.");
    }
  }

  function exportCustomFoods() {
    const customFoods = getCustomFoods();
    if (customFoods.length === 0) return alert("Aucun aliment personnalisé à exporter.");
    document.getElementById('bulk-input').value = JSON.stringify(customFoods, null, 2);
    alert("Données exportées dans le champ texte !");
  }

  function getTodayKey() { return new Date().toISOString().split('T')[0]; }
  function loadData() { return JSON.parse(localStorage.getItem('ww_data') || '{}'); }
  function saveData(data) { localStorage.setItem('ww_data', JSON.stringify(data)); updateUI(); }

  function addEntry(type) {
    const today = getTodayKey();
    const data = loadData();
    if (!data[today]) data[today] = { entries: [], sportPts: 0 };

    if (type === 'food') {
      let name = document.getElementById('food-search').value || 'Aliment';
      const qty = parseFloat(document.getElementById('food-qty').value) || 1;
      const pts = parseFloat(document.getElementById('food-pts').value) || 0;
      if (qty !== 1) name += ` (x${qty})`;

      data[today].entries.push({ id: Date.now(), type: 'food', name, pts, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
      document.getElementById('food-search').value = '';
      document.getElementById('food-qty').value = 1;
      document.getElementById('food-pts').value = '';
      document.getElementById('food-portion-info').innerText = '';
      currentRefPts = 0;
    } else {
      const name = document.getElementById('sport-search').value || 'Activité';
      const duration = parseFloat(document.getElementById('sport-duration').value) || 0;
      const matchedSport = SPORT_DATABASE.find(s => s.name.toLowerCase() === name.toLowerCase());
      let pts = matchedSport ? Math.round((duration / matchedSport.refDur) * matchedSport.pts * 10) / 10 : Math.round((duration / 15) * 1.5 * 10) / 10;

      data[today].entries.push({ id: Date.now(), type: 'sport', name, duration, pts, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
      data[today].sportPts += pts;
      document.getElementById('sport-search').value = '';
      document.getElementById('sport-duration').value = '';
    }

    saveData(data);
  }

  function deleteEntry(dateKey, entryId) {
    const data = loadData();
    if (data[dateKey]) {
      const entryIndex = data[dateKey].entries.findIndex(e => e.id === entryId);
      if (entryIndex !== -1) {
        const entry = data[dateKey].entries[entryIndex];
        if (entry.type === 'sport') data[dateKey].sportPts = Math.max(0, data[dateKey].sportPts - entry.pts);
        data[dateKey].entries.splice(entryIndex, 1);
        saveData(data);
      }
    }
  }

  function updateUI() {
    const today = getTodayKey();
    const data = loadData();
    const dayData = data[today] || { entries: [], sportPts: 0 };

    let foodPtsUsed = 0;
    dayData.entries.filter(e => e.type === 'food').forEach(e => foodPtsUsed += e.pts);

    let dailyLeft = DAILY_BUDGET - foodPtsUsed;
    let weeklyLeft = WEEKLY_BUDGET + dayData.sportPts;

    if (dailyLeft < 0) {
      weeklyLeft += dailyLeft;
      dailyLeft = 0;
    }

    document.getElementById('disp-daily-left').innerText = Math.round(dailyLeft * 10) / 10;
    document.getElementById('disp-weekly-left').innerText = Math.max(0, Math.round(weeklyLeft * 10) / 10);
    document.getElementById('disp-sport-pts').innerText = dayData.sportPts;

    const logList = document.getElementById('today-log-list');
    logList.innerHTML = dayData.entries.length === 0 ? '<p style="color:#aaa;">Rien de saisi aujourd\'hui</p>' : '';
    dayData.entries.forEach(e => {
      logList.innerHTML += `
        <div class="log-item">
          <div>
            <strong>${e.name}</strong> <small>(${e.time})</small>
          </div>
          <div>
            <span class="badge ${e.type === 'food' ? 'badge-food' : 'badge-sport'}">
              ${e.type === 'food' ? '-' + e.pts + ' SP' : '+' + e.pts + ' Pts Sport'}
            </span>
            <button class="btn-del" onclick="deleteEntry('${today}', ${e.id})">🗑️</button>
          </div>
        </div>`;
    });

    const historyList = document.getElementById('history-list');
    historyList.innerHTML = '';
    Object.keys(data).sort().reverse().forEach(date => {
      let dayTotalFood = 0;
      data[date].entries.filter(e => e.type === 'food').forEach(e => dayTotalFood += e.pts);
      let detailsHtml = data[date].entries.map(e => `
        <div style="font-size:0.85rem; color:#555; margin-top:4px;">
          • ${e.name} (${e.type === 'food' ? e.pts + ' SP' : '+' + e.pts + ' Pts Sport'})
        </div>
      `).join('');

      historyList.innerHTML += `
        <div class="history-card">
          <div class="flex-between">
            <strong>📅 ${date}</strong>
            <small>${Math.round(dayTotalFood * 10) / 10} SP | +${data[date].sportPts} Pts Sport</small>
          </div>
          ${detailsHtml}
        </div>`;
    });
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    event.target.classList.add('active');
  }

  // Activation du Service Worker pour le mode Hors-ligne / Zone Blanche
  if ('serviceWorker' in navigator) {
    const swCode = `
      self.addEventListener('install', e => e.waitUntil(caches.open('ww-pwa-v1').then(c => c.addAll(['./']))));
      self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
    `;
    const blob = new Blob([swCode], { type: 'text/javascript' });
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).catch(err => console.log('SW Offline non requis si local', err));
  }

  initDatalists();
  updateUI();
</script>
</body>
</html>
